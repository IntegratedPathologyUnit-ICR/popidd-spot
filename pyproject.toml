[project]
name = "popidd-spot"
version = "0.2.0"
description = "Spatial Profiling Overview Tool "
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "bokeh>=3.8.2",
    "hvplot>=0.12.2",
    "ipykernel>=7.2.0",
    "matplotlib>=3.10.8",
    "numpy>=2.2.6",
    "pandas>=2.3.3",
    "panel>=1.8.7",
    "param>=1.13.0",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = []
